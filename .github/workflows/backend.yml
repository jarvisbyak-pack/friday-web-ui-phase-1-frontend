name: Friday backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d friday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friday
      FRONTEND_ORIGIN: http://localhost:3000
      FILE_STORAGE_DIR: ./storage-test
      FILE_MAX_BYTES: 10485760
      AUTH_SESSION_DAYS: 7
      WORKER_POLL_MS: 25
      WORKER_STALE_TASK_MS: 30000
      CODE_WORKSPACE_ROOT: .
      CODE_ALLOWED_COMMANDS: npm test,npm run build
      CODE_COMMAND_TIMEOUT_MS: 120000
      CODE_MAX_OUTPUT_BYTES: 500000
      FRIDAY_ALLOW_CODE_EXECUTION: "false"
      AI_PROVIDER: gemini
      GEMINI_MODEL: gemini-2.5-flash
      GITHUB_API_URL: https://api.github.com
      FRIDAY_ALLOW_GITHUB_MUTATIONS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test