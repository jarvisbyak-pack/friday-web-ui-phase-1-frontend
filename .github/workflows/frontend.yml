name: Friday frontend checks
on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "api.js"
      - "index.html"
      - "styles.css"
      - "face.js"
      - "face.css"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "app.js"
      - "api.js"
      - "index.html"
      - "styles.css"
      - "face.js"
      - "face.css"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check api.js
          node --check app.js
          node --check face.js
      - name: Check required frontend files
        run: |
          test -s index.html
          test -s styles.css
          test -s face.css
          test -s face.js
      - name: Check production API configuration
        if: github.event_name != 'pull_request'
        env:
          FRIDAY_API_BASE_URL: ${{ vars.FRIDAY_API_BASE_URL }}
        run: |
          if [ -z "$FRIDAY_API_BASE_URL" ]; then
            echo "FRIDAY_API_BASE_URL is not configured; guest UI mode is allowed."
          else
            case "$FRIDAY_API_BASE_URL" in
              https://*) ;;
              *) echo "FRIDAY_API_BASE_URL must be an HTTPS backend origin when configured." >&2; exit 1 ;;
            esac
            node -e "new URL(process.env.FRIDAY_API_BASE_URL)"
          fi
