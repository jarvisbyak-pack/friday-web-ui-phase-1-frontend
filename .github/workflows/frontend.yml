name: Friday frontend checks

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "api.js"
      - "index.html"
      - "styles.css"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "app.js"
      - "api.js"
      - "index.html"
      - "styles.css"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check api.js
          node --check app.js
      - name: Check required frontend files
        run: |
          test -s index.html
          test -s styles.css
